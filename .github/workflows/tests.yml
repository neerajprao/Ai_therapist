name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-cloud.txt
            requirements-dev.txt
      # CPU only, no PyTorch and no model downloads: the tests use fakes.
      - run: pip install -r requirements-cloud.txt -r requirements-dev.txt
      - run: python -m pytest
